name: Apply MysticFlix changes
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          unzip -o mystic-changes.zip
          rm mystic-changes.zip
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Apply MysticFlix theme"
          git push
